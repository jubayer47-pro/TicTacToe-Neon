name: Build TicTacToe Neon AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/tictactoeneon/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

      - name: Copy app icon
        run: |
          cp tic-tac-toe-icon-512x512-1.png app/src/main/res/drawable/app_icon.png

      - name: Create settings.gradle.kts
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "TicTacToeNeon"
          include(":app")
          EOF

      - name: Create root Gradle file
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

      - name: Create app Gradle file
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.tictactoeneon.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.tictactoeneon.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("${project.rootDir}/upload-keystore.jks")
                      storePassword = "changeit"
                      keyAlias = "upload"
                      keyPassword = "changeit"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation("com.google.android.gms:play-services-ads:24.5.0")
          }
          EOF

      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/tictactoeneon/app/MainActivity.java <<'EOF'
          package com.tictactoeneon.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.interstitial.InterstitialAd;
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback;
          import com.google.android.gms.ads.rewarded.RewardItem;
          import com.google.android.gms.ads.rewarded.RewardedAd;
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback;

          public class MainActivity extends Activity {

              private WebView webView;
              private InterstitialAd interstitialAd;
              private RewardedAd rewardedAd;

              private static final String INTERSTITIAL_ID =
                      "ca-app-pub-7009578840220882/9661363983";

              private static final String REWARDED_ID =
                      "ca-app-pub-7009578840220882/6459847546";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  MobileAds.initialize(this, initializationStatus -> {});

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "https://jubayer47-pro.github.io/TicTacToe-Neon/"
                  );

                  loadInterstitial();
                  loadRewarded();
              }

              private void loadInterstitial() {
                  AdRequest adRequest = new AdRequest.Builder().build();

                  InterstitialAd.load(
                      this,
                      INTERSTITIAL_ID,
                      adRequest,
                      new InterstitialAdLoadCallback() {
                          @Override
                          public void onAdLoaded(InterstitialAd ad) {
                              interstitialAd = ad;
                          }

                          @Override
                          public void onAdFailedToLoad(LoadAdError error) {
                              interstitialAd = null;
                          }
                      }
                  );
              }

              private void loadRewarded() {
                  AdRequest adRequest = new AdRequest.Builder().build();

                  RewardedAd.load(
                      this,
                      REWARDED_ID,
                      adRequest,
                      new RewardedAdLoadCallback() {
                          @Override
                          public void onAdLoaded(RewardedAd ad) {
                              rewardedAd = ad;
                          }

                          @Override
                          public void onAdFailedToLoad(LoadAdError error) {
                              rewardedAd = null;
                          }
                      }
                  );
              }

              public void showGameOverAd() {
                  if (interstitialAd != null) {
                      interstitialAd.show(this);
                      interstitialAd = null;
                      loadInterstitial();
                  }
              }

              public void showRewardedAd() {
                  if (rewardedAd != null) {
                      rewardedAd.show(
                          this,
                          rewardItem -> {
                              // Reward handling will be connected
                              // to the game logic separately.
                          }
                      );

                      rewardedAd = null;
                      loadRewarded();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Create AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-7009578840220882~9991898447" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create Android resources
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Tic Tac Toe Neon</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#7C3AED</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore upload-keystore.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=TicTacToe Neon, OU=App, O=Jubayer, L=Dhaka, ST=Dhaka, C=BD"

      - name: Build signed AAB
        run: |
          gradle :app:bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Neon-AAB-AdMob
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Neon-Upload-Key
          path: upload-keystore.jks
